<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200" />
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630" />
  </g>

  <!-- Top Logo Bar -->
  <g transform="translate(80, 70)">
    <rect width="40" height="40" rx="10" fill="url(#accentGrad)" />
    <path d="M12 28 L20 12 L28 28 Z" fill="#ffffff" />
    <text x="56" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      WebsitePlatform<tspan fill="#38bdf8">.id</tspan>
    </text>
    <rect x="270" y="8" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" />
    <text x="335" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      KNOWLEDGE HUB
    </text>
  </g>

  <!-- Title & Headline -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Pusat Edukasi & Glosarium Website Modern
    </text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">
      93+ panduan teknis Core Web Vitals, SEO teknis, dan arsitektur web
    </text>
  </g>

  <!-- Tags / Pillars -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="220" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="110" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      ✓ 93 Istilah Terverifikasi
    </text>

    <rect x="236" y="0" width="240" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="356" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      ✓ Studi Kasus Bisnis
    </text>

    <rect x="492" y="0" width="220" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="602" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      ✓ Skema DefinedTerm
    </text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="40" fill="#64748b" font-family="system-ui, monospace" font-size="14">
      Next.js 16 • React 19 • Tailwind CSS • Core Web Vitals 100/100 • Zero Runtime Latency
    </text>
    <text x="1040" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">
      websiteplatform.id
    </text>
  </g>
